<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,
    initial-scale=1.0">

    <link rel="stylesheet" href="css/style.css">
    <title>EasyDrive | Automobiliu nuomos platforma</title>
</head>
<body>
    <!--navbar-->
    <div class="navbar">
        <div class="container flex">
            <h1 class="logo">EasyDrive.</h1>
            <nav>
                <ul>
                    <li><a href="index.html">Pagrindinis</a></li>
                    <li><a href="apiemus.html">Apie mus</a></li>
                    <li><a href="issinuomokite.html">Issinuomokite</a></li>
                </ul>
            </nav>
        </div>
    </div>


    <!-- Showcase-->
    <section class="showcase">
        <div class="container grid">
            <div class="showcase-text">
                <h1>Nuomokites patogiai</h1>
                <p>Issirinkite labiausiai patinkanti automobili, uzpildykite
                    forma ir vazinekites savo malonumui!</p>
                    <a href="apiemus.html" class="btn btn-outline">Placiau apie mus</a>
            </div>

            <div class="showcase-form card">
                <h2>Isbandyti</h2>
                <form>
                    <div class="form-control">
                        <input type="text" name="name" 
                        placeholder="Vardas" required>
                    </div>
                    <div class="form-control">
                        <input type="text" name="surname" 
                        placeholder="Pavarde" required>
                    </div>
                    <div class="form-control">
                        <input type="email" name="email" 
                        placeholder="Elektroninis pastas" required>
                    </div>
                    <input type="submit" value="Pateikti" class="btn btn-primary">
                </form>
            </div>
        </div>
    </section>


</body>
</html>
